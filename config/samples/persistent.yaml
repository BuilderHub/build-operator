# Persistent BuildkitBuilder - always-on, shared across users, stable PVC cache
apiVersion: builder-hub.dev/v1alpha1
kind: BuildkitBuilder
metadata:
  name: persistent-shared
  namespace: buildkit
spec:
  templateRef: default-template
  mode: persistent
  replicas: 1
  labels:
    builder.builder-hub.dev/pool: shared
    builder.builder-hub.dev/arch: amd64
