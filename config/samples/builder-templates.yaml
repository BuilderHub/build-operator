# Builder size templates aligned with frontend BUILDER_SIZES (small, medium, large, xlarge).
# Referenced by BuildkitBuilder.spec.templateRef (e.g. builder-small).
# Applied by build-operator Tiltfile so clusters have these templates before creating builders.
---
apiVersion: builder-hub.dev/v1alpha1
kind: BuildkitBuilderTemplate
metadata:
  name: builder-small
spec:
  buildkitImage: moby/buildkit:v0.18.0-rootless
  rootless: true
  arch: amd64
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  nodeSelector:
    kubernetes.io/arch: amd64
  cacheConfig:
    type: pvc
    pvc:
      storageClassName: ""
      size: "10Gi"
      accessModes:
        - ReadWriteOnce
---
apiVersion: builder-hub.dev/v1alpha1
kind: BuildkitBuilderTemplate
metadata:
  name: builder-medium
spec:
  buildkitImage: moby/buildkit:v0.18.0-rootless
  rootless: true
  arch: amd64
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  nodeSelector:
    kubernetes.io/arch: amd64
  cacheConfig:
    type: pvc
    pvc:
      storageClassName: ""
      size: "25Gi"
      accessModes:
        - ReadWriteOnce
---
apiVersion: builder-hub.dev/v1alpha1
