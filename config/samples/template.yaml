# BuildkitBuilderTemplate - example cluster-scoped blueprint (not applied by Tilt by default).
# See builder-templates.yaml for builder-small through builder-xlarge.
apiVersion: builder-template.builder-hub.dev/v1alpha1
kind: BuildkitBuilderTemplate
metadata:
  name: default-template
spec:
  buildkitImage: moby/buildkit:master-rootless
  rootless: true
  cacheConfig:
    type: pvc
    pvc:
      storageClassName: ""
      size: "100Gi"
      accessModes:
        - ReadWriteOnce
