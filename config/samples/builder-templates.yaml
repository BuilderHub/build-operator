# Builder size templates aligned with frontend BUILDER_SIZES (small, medium, large, xlarge).
# Referenced by BuildkitBuilder.spec.templateRef (e.g. builder-small).
# Applied by build-operator Tiltfile so clusters have these templates before creating builders.
#
# No arch/nodeSelector pin: moby/buildkit rootless images are multi-arch. Pinning amd64 breaks
# buildkitImage: master-rootless tracks BuildKit main (expect churn vs semver tags).
# local clusters on arm64 (Kind / Docker Desktop on Apple Silicon).
# No spec.resources: buildkitd runs with no CPU/memory requests or limits (BestEffort); set
# spec.resources on a custom template when you need QoS guarantees.
---
apiVersion: builder-hub.dev/v1alpha1
kind: BuildkitBuilderTemplate
metadata:
  name: builder-small
spec:
  buildkitImage: moby/buildkit:master-rootless
  rootless: true
  cacheConfig:
    type: pvc
    pvc:
      storageClassName: ""
      size: "10Gi"
      accessModes:
        - ReadWriteOnce
---
apiVersion: builder-hub.dev/v1alpha1
kind: BuildkitBuilderTemplate
metadata:
  name: builder-medium
spec:
  buildkitImage: moby/buildkit:master-rootless
  rootless: true
  cacheConfig:
    type: pvc
    pvc:
      storageClassName: ""
      size: "25Gi"
      accessModes:
        - ReadWriteOnce
---
apiVersion: builder-hub.dev/v1alpha1
kind: BuildkitBuilderTemplate
metadata:
  name: builder-large
spec:
  buildkitImage: moby/buildkit:master-rootless
  rootless: true
  cacheConfig:
    type: pvc
    pvc:
      storageClassName: ""
      size: "50Gi"
      accessModes:
        - ReadWriteOnce
---
apiVersion: builder-hub.dev/v1alpha1
kind: BuildkitBuilderTemplate
metadata:
  name: builder-xlarge
spec:
  buildkitImage: moby/buildkit:master-rootless
  rootless: true
  cacheConfig:
    type: pvc
    pvc:
      storageClassName: ""
      size: "100Gi"
      accessModes:
        - ReadWriteOnce
