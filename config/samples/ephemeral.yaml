# NOTE: "ephemeral" mode has been removed from BuilderHub.
#
# Use "persistent" or "sleepy" instead. Example:
apiVersion: builder-hub.dev/v1alpha1
kind: BuildkitBuilder
metadata:
  name: persistent-example
  namespace: buildkit
spec:
  templateRef: default-template
  mode: persistent
  replicas: 1
  labels:
    builder.builder-hub.dev/pool: ci
